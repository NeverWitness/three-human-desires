name: Deploy MkDocs site to Pages

on:
#  push:
#    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  NO_MKDOCS_2_WARNING: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "mkdocs<2" "mkdocs-material<10" "mkdocs-static-i18n"

      - name: Prepare build docs
        run: |
          mkdir -p build_docs
          rm -rf build_docs
          mkdir -p build_docs
          rsync -a --exclude '_drafts' docs/zh/预发布/ build_docs/zh/
          rsync -a --exclude '_drafts' docs/en-US/ build_docs/en/
          rsync -a docs/stylesheets build_docs
          rsync docs/google023d0b35621806c9.html build_docs
          rsync docs/robot.txt build_docs

      - name: Set build date
        run: |
          echo "BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_ENV
          echo "VERSION=$(cat version)" >> $GITHUB_ENV
          echo "VERSION_EN_US=$(cat version_en_US)" >> $GITHUB_ENV

      - name: Inject build date into homepage
        run: |
          DATE="$BUILD_DATE"

          # 中文首页
          {
            echo "---"
            echo "title: 耦合预测环自我生成假说"
            echo "description: "
            echo "---"
            echo ""
            echo "> *Version: $VERSION · Build: $DATE*"
            echo ""
            echo "---"
            echo ""
            cat build_docs/zh/index.md
          } > /tmp/zh_index.md
          mv /tmp/zh_index.md build_docs/zh/index.md

          # 英文首页
          {
            echo "---"
            echo "title: Self from Coupled Predictive Loops Hypothesis"
            echo "description:"
            echo "---"
            echo ""
            echo "> *Version: $VERSION_EN_US · Build: $DATE*"
            echo ""
            echo "---"
            echo ""
            cat build_docs/zh/index.md
          } > /tmp/en_index.md

          mv /tmp/en_index.md build_docs/en/index.md

      - name: Build site
        run: mkdocs build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
